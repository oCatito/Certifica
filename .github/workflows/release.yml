# Testa, gera o Certifica.exe (Windows) e o Certifica.app (macOS) e publica um release com os dois.
# Dispara ao enviar uma tag que comece com "v" (ex.: v1.0.0).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # permite rodar manualmente (gera os arquivos sem criar release)

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Conferir se a tag bate com a versão do app
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' app/__init__.py)
          if [ "$tag" != "$version" ]; then
            echo "::error::A tag v$tag não bate com __version__ = \"$version\" em app/__init__.py. Atualize a versão antes de criar a tag."
            exit 1
          fi
          echo "Versão $version confere com a tag."

  windows:
    needs: check-version
    runs-on: windows-latest
    timeout-minutes: 20 # se algo travar, falha em vez de esperar 6 horas
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependências
        shell: cmd
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --quiet --upgrade pip
          .venv\Scripts\python -m pip install --quiet -r requirements-dev.txt

      - name: Rodar os testes
        timeout-minutes: 5
        shell: cmd
        run: .venv\Scripts\python -m pytest -q

      - name: Gerar Certifica.exe
        shell: cmd
        run: build_windows.bat

      - uses: actions/upload-artifact@v7
        with:
          name: Certifica-windows
          path: dist/Certifica.exe

  macos:
    needs: check-version
    runs-on: macos-latest # chip Apple (M1 ou mais novo)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet -r requirements-dev.txt

      - name: Rodar os testes
        timeout-minutes: 5
        run: .venv/bin/python -m pytest -q

      - name: Gerar Certifica.app
        run: ./build_mac.sh

      - name: Compactar o .app
        # ditto preserva links simbólicos, permissões e a assinatura ad hoc do app
        run: ditto -c -k --keepParent dist/Certifica.app Certifica-macOS.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Certifica-macos
          path: Certifica-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Publicar release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Certifica.exe
            Certifica-macOS.zip
          generate_release_notes: true
